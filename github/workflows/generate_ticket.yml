name: Generate Composite Ticket

on:
  workflow_dispatch:
  # Optional webhook trigger if you use an external connector later
  # repository_dispatch:
    # types: [generate-ticket]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to let the Action push the generated ticket back to your repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install Pillow

      - name: Run ticket composition script
        run: python composite-ticket.py

      - name: Commit and push final ticket
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add final_ticket.png
          git commit -m "Auto-generate final composite ticket [skip ci]" || exit 0
          git push
