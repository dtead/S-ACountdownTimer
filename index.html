<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Singles &amp; Ale Countdown</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'DM Sans', sans-serif; 
      /* Fades the left and right edges into a transparent background */
      mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
    }
    .spinner-ring {
      width: 100px; height: 100px; border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0%, #818cf8 40%, #c084fc 70%, transparent 100%);
      animation: spin 1.5s linear infinite;
      display: flex; align-items: center; justify-content: center;
    }
    .spinner-ring::after {
      content: ''; width: 80px; height: 80px; border-radius: 50%;
      background: #1e1b2e;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .glow {
      position: absolute; width: 100px; height: 100px; border-radius: 50%;
      background: radial-gradient(circle, rgba(129,140,248,0.4) 0%, transparent 70%);
      animation: glow-pulse 2s ease-in-out infinite;
    }
    @keyframes glow-pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.6); opacity: 0.15; }
    }
    .pulse-ring {
      position: absolute; width: 100px; height: 100px; border-radius: 50%;
      border: 2px solid rgba(129,140,248,0.3);
      animation: pulse-out 3s ease-out infinite;
    }
    .pulse-ring:nth-child(3) { animation-delay: 1s; }
    @keyframes pulse-out {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(3); opacity: 0; }
    }
    .countdown-unit {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .countdown-value {
      font-size: 3rem; font-weight: 700; line-height: 1;
      color: #f0f0ff; font-variant-numeric: tabular-nums;
    }
    .countdown-label {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: #a5b4fc;
    }
    .cursor-ripple { position: fixed; pointer-events: none; }
    .ripple-ring {
      position: absolute; width: 60px; height: 60px; border: 2px solid;
      border-radius: 50%; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: ripple-expand 1.5s ease-out forwards;
    }
    @keyframes ripple-expand {
      0% { width: 60px; height: 60px; opacity: 0.8; }
      100% { width: 180px; height: 180px; opacity: 0; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
</head>
<body data-template-id="__page-root" class="w-full flex flex-col items-center justify-center gap-8 px-4" style="min-height: calc(100 * min(var(--vh,1vh),1vh)); background: radial-gradient(rgb(37, 26, 104), rgb(37, 29, 109), rgb(23, 19, 49));">
  <div class="flex flex-col items-center text-center">
   <h1 data-template-id="heading-text" class="canva-text mb-2" style="color: rgb(240, 240, 255); font-weight: 700; font-style: normal; font-size: 48px;">It's Almost Time!</h1>
   <p data-template-id="sub-text" class="canva-text" style="color: rgb(182, 195, 255); font-weight: 400; font-style: normal; font-size: 18px;">Thursday, August 27 · 7:00 PM</p>
  </div>
  <div class="relative flex items-center justify-center">
   <div class="glow"></div>
   <div class="pulse-ring"></div>
   <div class="pulse-ring"></div>
   <div class="spinner-ring"></div>
  </div>
  <div id="countdown" class="flex gap-6 sm:gap-10">
   <div class="countdown-unit">
    <span id="cd-days" class="countdown-value">--</span><span class="countdown-label">Days</span>
   </div>
   <div class="countdown-unit">
    <span id="cd-hours" class="countdown-value">--</span><span class="countdown-label">Hours</span>
   </div>
   <div class="countdown-unit">
    <span id="cd-mins" class="countdown-value">--</span><span class="countdown-label">Min</span>
   </div>
   <div class="countdown-unit">
    <span id="cd-secs" class="countdown-value">--</span><span class="countdown-label">Sec</span>
   </div>
  </div>
  <p data-template-id="status-text" class="canva-text" style="color: rgb(165, 180, 252); font-weight: 600; font-style: normal; font-size: 14px;">SEE YOU THERE 🍻</p>
  <script>
    const target = new Date('2026-08-27T19:00:00');
    function tick() {
      const diff = Math.max(0, target - Date.now());
      const s = Math.floor(diff/1000);
      document.getElementById('cd-days').textContent = String(Math.floor(s/86400)).padStart(2,'0');
      document.getElementById('cd-hours').textContent = String(Math.floor((s%86400)/3600)).padStart(2,'0');
      document.getElementById('cd-mins').textContent = String(Math.floor((s%3600)/60)).padStart(2,'0');
      document.getElementById('cd-secs').textContent = String(s%60).padStart(2,'0');
    }
    tick();
    setInterval(tick, 1000);

    const colors = ['#c084fc','#818cf8','#a5b4fc','#ddd6fe'];
    let lastR = 0;
    document.addEventListener('mousemove', e => {
      const now = Date.now();
      if (now - lastR < 80) return;
      lastR = now;
      const c = document.createElement('div');
      c.className = 'cursor-ripple';
      c.style.left = e.clientX + 'px';
      c.style.top = e.clientY + 'px';
      const r = document.createElement('div');
      r.className = 'ripple-ring';
      r.style.borderColor = colors[Math.floor(Math.random()*colors.length)];
      c.appendChild(r);
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 1500);
    });
  </script>
</body>
</html>
