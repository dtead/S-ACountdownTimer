<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Singles &amp; Ale Flip Countdown</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'DM Sans', sans-serif; 
      background: transparent; 
      margin: 0; 
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
    }
    .countdown-unit {
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 6px;
    }
    /* Static Flip Card Base */
    .flip-card {
      position: relative;
      background: #1e1b2e;
      border: 2px solid rgba(129, 140, 248, 0.4);
      border-radius: 12px;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      perspective: 400px;
      overflow: hidden;
    }
    .flip-card::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(129, 140, 248, 0.3);
      z-index: 10;
    }
    .countdown-value {
      font-size: 2.2rem; 
      font-weight: 700; 
      line-height: 1;
      color: #f0f0ff; 
      font-variant-numeric: tabular-nums;
      z-index: 1;
    }
    /* Smooth, slower top flap folding down */
    .top-flap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: #28243f;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      transform-origin: bottom;
      backface-visibility: hidden;
      z-index: 5;
    }
    .top-flap span {
      position: absolute;
      top: 0;
      font-size: 2.2rem;
      font-weight: 700;
      color: #f0f0ff;
      line-height: 72px;
    }
    .fold-down {
      animation: flipTop 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes flipTop {
      0% { transform: rotateX(0deg); filter: brightness(1); }
      100% { transform: rotateX(-90deg); filter: brightness(0.4); }
    }
    .countdown-label {
      font-size: 0.7rem; 
      text-transform: uppercase; 
      letter-spacing: 0.15em; 
      color: #a5b4fc;
    }
    .cursor-ripple { 
      position: fixed; 
      pointer-events: none; 
    }
    .ripple-ring {
      position: absolute; 
      width: 60px; 
      height: 60px; 
      border: 2px solid;
      border-radius: 50%; 
      top: 50%; 
      left: 50%;
      transform: translate(-50%, -50%);
      animation: ripple-expand 1.5s ease-out forwards;
    }
    @keyframes ripple-expand {
      0% { width: 60px; height: 60px; opacity: 0.8; }
      100% { width: 180px; height: 180px; opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="countdown" class="flex gap-3 sm:gap-5">
    <div class="countdown-unit">
      <div class="flip-card" id="card-days">
        <span id="cd-days" class="countdown-value">--</span>
      </div>
      <span class="countdown-label">Days</span>
    </div>
    <div class="countdown-unit">
      <div class="flip-card" id="card-hours">
        <span id="cd-hours" class="countdown-value">--</span>
      </div>
      <span class="countdown-label">Hours</span>
    </div>
    <div class="countdown-unit">
      <div class="flip-card" id="card-mins">
        <span id="cd-mins" class="countdown-value">--</span>
      </div>
      <span class="countdown-label">Min</span>
    </div>
    <div class="countdown-unit">
      <div class="flip-card" id="card-secs">
        <span id="cd-secs" class="countdown-value">--</span>
      </div>
      <span class="countdown-label">Sec</span>
    </div>
  </div>

  <script>
    const target = new Date('2026-08-27T19:00:00').getTime();

    function updateValue(id, newValue) {
      const el = document.getElementById(id);
      if (el.textContent !== newValue) {
        const card = el.closest('.flip-card');
        const oldValue = el.textContent;
        el.textContent = newValue;

        if (oldValue !== '--') {
          const flap = document.createElement('div');
          flap.className = 'top-flap';
          const span = document.createElement('span');
          span.textContent = oldValue;
          flap.appendChild(span);
          card.appendChild(flap);

          flap.offsetHeight; 
          flap.classList.add('fold-down');
          setTimeout(() => flap.remove(), 600);
        }
      }
    }

    function tick() {
      const diff = Math.max(0, target - Date.now());
      const s = Math.floor(diff / 1000);
      
      updateValue('cd-days', String(Math.floor(s / 86400)).padStart(2, '0'));
      updateValue('cd-hours', String(Math.floor((s % 86400) / 3600)).padStart(2, '0'));
      updateValue('cd-mins', String(Math.floor((s % 3600) / 60)).padStart(2, '0'));
      updateValue('cd-secs', String(s % 60).padStart(2, '0'));
    }

    tick();
    setInterval(tick, 1000);

    const colors = ['#c084fc', '#818cf8', '#a5b4fc', '#ddd6fe'];
    let lastR = 0;
    document.addEventListener('mousemove', e => {
      const now = Date.now();
      if (now - lastR < 80) return;
      lastR = now;
      const c = document.createElement('div');
      c.className = 'cursor-ripple';
      c.style.left = e.clientX + 'px';
      c.style.top = e.clientY + 'px';
      const r = document.createElement('div');
      r.className = 'ripple-ring';
      r.style.borderColor = colors[Math.floor(Math.random() * colors.length)];
      c.appendChild(r);
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 1500);
    });
  </script>
</body>
</html>
