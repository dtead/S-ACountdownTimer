<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Singles &amp; Ale Flip Countdown</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      background: #111111 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    body { 
      font-family: 'DM Sans', sans-serif; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .countdown-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .event-date {
      color: #d4af37; /* Warm Gold accent matching the logo text */
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 2px;
      text-align: center;
    }
    .countdown-unit {
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 6px;
    }
    /* Flip Card Styled with Brand Crimson & Dark Charcoal */
    .flip-card {
      position: relative;
      background: #1a1a1a;
      border: 2px solid #8B0000; /* Deep Crimson Accent */
      border-radius: 12px;
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      perspective: 400px;
      overflow: hidden;
    }
    .flip-card::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(139, 0, 0, 0.4);
      z-index: 10;
    }
    .countdown-value {
      font-size: 2rem; 
      font-weight: 700; 
      line-height: 1;
      color: #ffffff; 
      font-variant-numeric: tabular-nums;
      z-index: 1;
    }
    /* Top flap folding down with darker crimson tone */
    .top-flap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: #600000;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      transform-origin: bottom;
      backface-visibility: hidden;
      z-index: 5;
    }
    .top-flap span {
      position: absolute;
      top: 0;
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 68px;
    }
    .fold-down {
      animation: flipTop 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes flipTop {
      0% { transform: rotateX(0deg); filter: brightness(1); }
      100% { transform: rotateX(-90deg); filter: brightness(0.5); }
    }
    .countdown-label {
      font-size: 0.65rem; 
      text-transform: uppercase; 
      letter-spacing: 0.15em; 
      color: #cccccc;
    }
  </style>
</head>
<body>
  <div class="countdown-container">
    <div class="event-date">Thursday, August 27, 2026 at 7:00pm</div>
    <div id="countdown" class="flex gap-3 sm:gap-4">
      <div class="countdown-unit">
        <div class="flip-card" id="card-days">
          <span id="cd-days" class="countdown-value">--</span>
        </div>
        <span class="countdown-label">Days</span>
      </div>
      <div class="countdown-unit">
        <div class="flip-card" id="card-hours">
          <span id="cd-hours" class="countdown-value">--</span>
        </div>
        <span class="countdown-label">Hours</span>
      </div>
      <div class="countdown-unit">
        <div class="flip-card" id="card-mins">
          <span id="cd-mins" class="countdown-value">--</span>
        </div>
        <span class="countdown-label">Min</span>
      </div>
      <div class="countdown-unit">
        <div class="flip-card" id="card-secs">
          <span id="cd-secs" class="countdown-value">--</span>
        </div>
        <span class="countdown-label">Sec</span>
      </div>
    </div>
  </div>

  <script>
    const target = new Date('2026-08-27T19:00:00').getTime();

    function updateValue(id, newValue) {
      const el = document.getElementById(id);
      if (el.textContent !== newValue) {
        const card = el.closest('.flip-card');
        const oldValue = el.textContent;
        el.textContent = newValue;

        if (oldValue !== '--') {
          const flap = document.createElement('div');
          flap.className = 'top-flap';
          const span = document.createElement('span');
          span.textContent = oldValue;
          flap.appendChild(span);
          card.appendChild(flap);

          flap.offsetHeight; 
          flap.classList.add('fold-down');
          setTimeout(() => flap.remove(), 600);
        }
      }
    }

    function tick() {
      const diff = Math.max(0, target - Date.now());
      const s = Math.floor(diff / 1000);
      
      updateValue('cd-days', String(Math.floor(s / 86400)).padStart(2, '0'));
      updateValue('cd-hours', String(Math.floor((s % 86400) / 3600)).padStart(2, '0'));
      updateValue('cd-mins', String(Math.floor((s % 3600) / 60)).padStart(2, '0'));
      updateValue('cd-secs', String(s % 60).padStart(2, '0'));
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
